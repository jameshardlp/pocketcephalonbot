[phases.setup]
nixPkgs = [
    "python311",
    "python311Packages.pip",
    "python311Packages.virtualenv",
    "gcc",
    "libxml2",
    "libxslt",
    "libffi",
    "openssl",
    "sqlite",
    "postgresql"
]

[phases.install]
cmds = [
    "pip install --upgrade pip setuptools wheel",
    "pip install --no-cache-dir -r requirements.txt"
]

[phases.start]
cmd = "python start.py"

# Отключаем Node.js для статических файлов
[build]
# Игнорируем .js файлы в корне, чтобы Node.js их не обрабатывал
ignore = [
    "widget/*.js",
    "*.js"
]

[metadata]
name = "Warframe Bot"
version = "2.0.0"
description = "Telegram bot for Warframe notifications with widget"

[web]
port = 8000
cmd = "python -m uvicorn web.server:app --host 0.0.0.0 --port $PORT"

[worker]
cmd = "python bot.py"

# Health check для веб-сервера
[healthcheck]
path = "/api/health"
port = 8000
timeout = 10
interval = 30
