<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warframe Widget</title>
    <link rel="stylesheet" href="/static/widget.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <h2>🎯 Warframe</h2>
            <span class="update-time" id="updateTime">Обновлено: --:--:--</span>
        </div>
        
        <div class="notifications" id="notifications">
            <div class="loading">⏳ Загрузка уведомлений...</div>
        </div>
        
        <div class="footer">
            <button onclick="refreshData()">🔄 Обновить</button>
            <button onclick="openTelegram()">📱 Открыть бота</button>
        </div>
    </div>
    
    <script src="/static/widget.browser.js"></script>
</body>
</html>
